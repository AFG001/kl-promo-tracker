<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KL Electronics Promo Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="app-header">
    <div class="header-left">
      <h1>KL Electronics Promo Tracker</h1>
      <span class="subtitle">Kuala Lumpur — Retail &amp; Event Promotions</span>
    </div>
    <div class="header-actions">
      <button class="btn btn-primary" onclick="exportCSV()">↓ Export CSV</button>
      <span class="updated-badge" id="updated-badge">Loading…</span>
    </div>
  </header>

  <div class="filter-bar">
    <div class="filter-group">
      <label>Source</label>
      <select id="filter-site" onchange="applyFilters()">
        <option value="">All</option>
      </select>
    </div>
    <div class="filter-group">
      <label>Category</label>
      <select id="filter-category" onchange="applyFilters()">
        <option value="">All</option>
        <option value="Electronics">Electronics</option>
        <option value="Brand Event">Brand Event</option>
        <option value="Mall Event">Mall Event</option>
        <option value="Online">Online</option>
        <option value="Other">Other</option>
      </select>
    </div>
    <div class="filter-group">
      <label>Tier</label>
      <select id="filter-tier" onchange="applyFilters()">
        <option value="">All</option>
        <option value="Tier1-Exhibition">Tier 1 – Exhibition</option>
        <option value="Tier2-Retail">Tier 2 – Retail</option>
        <option value="Tier3-Venue">Tier 3 – Venue</option>
        <option value="Tier4-Media">Tier 4 – Media</option>
        <option value="Tier5-Brand">Tier 5 – Brand</option>
        <option value="Tier6-Online">Tier 6 – Online</option>
      </select>
    </div>
    <div class="filter-group">
      <label>Search</label>
      <input type="text" id="filter-search" placeholder="Title, organiser…" oninput="debounceSearch()" />
    </div>
    <div class="filter-group stats-group">
      <span id="stats-label">Events: —</span>
      <button id="hidden-badge" class="btn-restore" onclick="openHiddenModal()" style="display:none"></button>
    </div>
  </div>

  <div class="main-layout">
    <div class="calendar-panel">
      <div id="calendar"></div>
    </div>
    <div class="side-panel" id="side-panel">
      <div class="side-placeholder">
        <span>📅</span>
        <p>Click an event to<br>view details</p>
      </div>
    </div>
  </div>

  <div class="status-bar">
    <span id="status-text">Loading events…</span>
  </div>

  <div class="toast" id="toast"></div>

  <!-- Hidden Events Modal -->
  <div class="modal-overlay" id="hidden-modal-overlay" onclick="if(event.target===this)_closeHiddenModal()">
    <div class="modal modal--narrow">
      <div class="modal-header">
        <h2>🗑 Hidden Events</h2>
        <button class="modal-close" onclick="_closeHiddenModal()">✕</button>
      </div>
      <div class="modal-body" style="padding:12px 16px">
        <div id="hidden-events-list"></div>
      </div>
      <div class="modal-footer">
        <button class="btn" onclick="_closeHiddenModal()">Close</button>
        <button id="hidden-restore-all-btn" class="btn btn-secondary" onclick="restoreAllHidden()">↩ Restore All</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
